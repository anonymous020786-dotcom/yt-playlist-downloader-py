[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ytpdl"
version = "2.0.0"
description = "YouTube Playlist Downloader — a modern PySide6 rewrite"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "YTPDL contributors" }]
dependencies = [
    "PySide6-Essentials>=6.7",
    "yt-dlp>=2024.8",
    "mutagen>=1.47",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.6", "ruff>=0.6"]

[project.gui-scripts]
ytpdl = "ytpdl.app:main"

[project.scripts]
ytpdl-cli = "ytpdl.app:main"

[tool.setuptools]
packages = ["ytpdl", "ytpdl.core", "ytpdl.ui", "ytpdl.ui.pages", "ytpdl.ui.widgets", "ytpdl.i18n"]

[tool.setuptools.package-data]
"ytpdl.i18n" = ["locales/*.json"]
"ytpdl.resources" = ["*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
